[package]
name = "vibe-manager"
version = "0.5.0"
edition = "2021"
description = "Vibe Manager - Docker app management dashboard backend"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
bcrypt = "0.17"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-stream = "0.3"
futures = "0.3"
png = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
